server:
  port: 8081

spring:
  application:
    name: enova-backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/enova_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# JWT Configuration
jwt:
  secret: enova-super-secret-key-for-jwt-token-generation-2026-must-be-at-least-256-bits-long
  expiration: 86400000
  refresh-expiration: 604800000

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}

openai:
  api-key: ${OPENAI_API_KEY:}
  stt:
    model: ${OPENAI_STT_MODEL:gpt-4o-mini-transcribe}
    language: ${OPENAI_STT_LANGUAGE:en}
  tts:
    model: ${OPENAI_TTS_MODEL:gpt-4o-mini-tts}
    voice: ${OPENAI_TTS_VOICE:alloy}
  chat:
    model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

google:
  credentials: ${GOOGLE_APPLICATION_CREDENTIALS:}
  stt:
    language: ${GOOGLE_STT_LANGUAGE:en-US}
    sample-rate: ${GOOGLE_STT_SAMPLE_RATE:16000}
    encoding: ${GOOGLE_STT_ENCODING:LINEAR16}

media:
  upload-dir: ${MEDIA_UPLOAD_DIR:uploads}
  max-size-mb: ${MEDIA_MAX_SIZE_MB:20}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:3000/app/payment/vnpay-return}
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8081/api/payments/vnpay/ipn}

# Logging
logging:
  level:
    com.enova: DEBUG
    org.springframework.security: INFO

notification:
  reminder-cron: "0 0 8 * * *"
